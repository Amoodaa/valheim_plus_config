name: Deploy config to Host Havoc

on:
  push:
    branches:
      - main
    paths:
      - valheim_plug.cfg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosthavoc-config
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload Valheim Plus config
        env:
          HOSTHAVOC_FTP_URL: ${{ secrets.HOSTHAVOC_FTP_URL }}
          HOSTHAVOC_FTP_USERNAME: ${{ secrets.HOSTHAVOC_FTP_USERNAME }}
          HOSTHAVOC_FTP_PASSWORD: ${{ secrets.HOSTHAVOC_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HOSTHAVOC_FTP_URL:?Missing HOSTHAVOC_FTP_URL}"
          : "${HOSTHAVOC_FTP_USERNAME:?Missing HOSTHAVOC_FTP_USERNAME}"
          : "${HOSTHAVOC_FTP_PASSWORD:?Missing HOSTHAVOC_FTP_PASSWORD}"

          timeout 45s lftp \
            -u "$HOSTHAVOC_FTP_USERNAME","$HOSTHAVOC_FTP_PASSWORD" \
            -e 'set net:max-retries 1; set net:timeout 15; set ssl:verify-certificate no; set sftp:auto-confirm yes; cd BepInEx/config; put valheim_plug.cfg -o valheim_plus.cfg; bye' \
            "$HOSTHAVOC_FTP_URL"
